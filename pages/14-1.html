<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>陈依然：JavaScript</h2>
    <script>
        //输出，陈依然，你好，document、alert、console三种方式
        document.write("陈依然，你好");
        alert("陈依然，你好");
        console.log("陈依然，你好");
        //confirm和prompt函数
        confirm("确认吗？");
        prompt("请输入你的姓名");
        //prompt（”请输入你的姓名“，”默认值“）
        //prompt（”请输入你的姓名“，”默认值“，”输入你的宽度“）
    </script>
</body>
</html>

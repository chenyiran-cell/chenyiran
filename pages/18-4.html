  };

  var cyr_raw = JSON.parse(document.getElementById('cyr_raceData').textContent);
  var cyr_header = cyr_raw[0];
  var cyr_data = cyr_raw.slice(1);

  var cyr_years = [];
  var cyr_yearMap = {};
  for (var i = 0; i < cyr_data.length; i++) {
    var yr = cyr_data[i][4];
    if (cyr_yearMap[yr] === undefined) {
      cyr_yearMap[yr] = cyr_years.length;
      cyr_years.push(yr);
    }
  }

  // 按年份聚合数据
  var cyr_seriesByYear = {};
  for (var i = 0; i < cyr_data.length; i++) {
    var row = cyr_data[i];
    var yr = row[4];
    var country = row[3];
    var income = row[0];
    if (!cyr_seriesByYear[yr]) cyr_seriesByYear[yr] = [];
    cyr_seriesByYear[yr].push({ name: country, value: income });
  }

  var cyr_currentYearIdx = cyr_years.length - 1;
  var cyr_updateInterval = 2000;
  var cyr_timer = null;

  function cyr_getTop10(yearIdx) {
    var yr = cyr_years[yearIdx];
    var items = cyr_seriesByYear[yr].slice();
    items.sort(function(a, b) { return b.value - a.value; });
    return items.slice(0, 10);
  }

  function cyr_buildOption(yearIdx) {
    var yr = cyr_years[yearIdx];
    var top10 = cyr_getTop10(yearIdx);

    var names = top10.map(function(d) {
      var flag = cyr_flags[d.name] || '';
      return flag + '  ' + d.name;
    });
    var values = top10.map(function(d) { return d.value; });
    var colors = top10.map(function(d) { return cyr_countryColors[d.name] || '#6366f1'; });

    // 反转让最高的在上面
    names.reverse();
    values.reverse();
    colors.reverse();

      title: {
        text: '各国人均 GDP 动态排名',
        subtext: 'Year: ' + yr,
        left: 'center', top: 10,
        textStyle: { color: '#fbbf24', fontSize: 18 },
        subtextStyle: { color: '#94a3b8', fontSize: 14 }
      },
      tooltip: {
        trigger: 'axis',
        backgroundColor: 'rgba(15,23,42,0.9)',
        borderColor: '#334155',
        textStyle: { color: '#fff' },
        formatter: function(p) {
          var d = p[0];
          var rawName = d.name.replace(/^[^\s]+\s+/, '').trim();
          return rawName + '<br/>人均 GDP: $' + d.value.toLocaleString();
        }
      },
      grid: { top: 80, bottom: 20, left: 180, right: 80 },
      xAxis: {
        type: 'value',
        axisLabel: { color: '#94a3b8', formatter: function(v) { return '$' + (v / 1000).toFixed(0) + 'k'; } },
        axisLine: { lineStyle: { color: '#334155' } },
        splitLine: { lineStyle: { color: 'rgba(51,65,85,0.3)' } }
      },
      yAxis: {
        type: 'category',
        data: names,
        axisLabel: { color: '#e2e8f0', fontSize: 14 },
        axisLine: { lineStyle: { color: '#334155' } },
        axisTick: { show: false }
      },
      series: [{
        type: 'bar',
        data: values.map(function(v, i) {
          return {
            value: v,
            itemStyle: { color: colors[i], borderRadius: [0, 6, 6, 0] }
          };
        }),
        label: {
          show: true, position: 'right',
          formatter: function(p) { return '$' + p.value.toLocaleString(); },
          color: '#e2e8f0', fontSize: 12
        },
        barWidth: '60%',
        animationDuration: 800,
        animationEasing: 'cubicOut'
      }]
    };
  }

  function cyr_raceStart() {
    cyr_racePause();
    cyr_timer = setInterval(function() {
      cyr_currentYearIdx++;
      if (cyr_currentYearIdx >= cyr_years.length) cyr_currentYearIdx = 0;
      chart1.setOption(cyr_buildOption(cyr_currentYearIdx));
    }, cyr_updateInterval);
  }
  function cyr_racePause() {
    if (cyr_timer) { clearInterval(cyr_timer); cyr_timer = null; }
  }
  function cyr_raceReset() {
    cyr_racePause();
    cyr_currentYearIdx = cyr_years.length - 1;
    chart1.setOption(cyr_buildOption(cyr_currentYearIdx));
  }
  function cyr_raceSpeed(dir) {
    cyr_updateInterval = Math.max(300, Math.min(5000, cyr_updateInterval + dir * 500));
    if (cyr_timer) cyr_raceStart();
    alert('当前间隔：' + cyr_updateInterval + 'ms');
  }

  // 初始显示最新年份
  cyr_raceReset();

  // 暴露到全局
  window.cyr_raceStart = cyr_raceStart;
  window.cyr_racePause = cyr_racePause;
  window.cyr_raceReset = cyr_raceReset;
  window.cyr_raceSpeed = cyr_raceSpeed;

  /* ============ 图表 2：bar-polar-real-estate ============ */
  var chart2 = echarts.init(document.getElementById('cyr_chart2'));

  var cyr_cityData = [
    [5000, 10000, 6785.71], [4000, 10000, 6825], [3000, 6500, 4463.33],
    [2500, 5600, 3793.83], [2000, 4000, 3060], [2000, 4000, 3222.33],
    [2500, 4000, 3133.33], [1800, 4000, 3100], [2000, 3500, 2750],
    [2000, 3000, 2500], [1800, 3000, 2433.33], [2000, 2700, 2375],
    [1500, 2800, 2150], [1500, 2300, 2100], [1600, 3500, 2057.14],
    [1500, 2600, 2037.5], [1500, 2417.54, 1905.85], [1500, 2000, 1775],
    [1500, 1800, 1650]
  ];
  var cyr_cities = ['北京', '上海', '深圳', '广州', '苏州', '杭州', '南京', '福州', '青岛', '济南', '长春', '大连', '温州', '郑州', '武汉', '成都', '东莞', '沈阳', '烟台'];

  var cyr_showAvg = true;

  function cyr_buildPolarOption() {
    var barHeight = 50;
    var data = cyr_cityData.map(function(item, i) {
      return {
        name: cyr_cities[i],
        value: item[2],  // Average
        itemStyle: {
          color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
            { offset: 0, color: '#6366f1' },
            { offset: 0.5, color: '#8b5cf6' },
            { offset: 1, color: '#ec4899' }
          ])
        }
      };
    });

    return {
      title: {
        text: '中国主要城市租房均价',
        subtext: '单位：元/㎡·月 · 数据来自 numbeo.com',
        left: 'center', top: 10,
        textStyle: { color: '#fbbf24', fontSize: 18 },
        subtextStyle: { color: '#94a3b8', fontSize: 13 }
      },
      tooltip: {
        trigger: 'item',
        backgroundColor: 'rgba(15,23,42,0.9)',
        borderColor: '#334155',
        textStyle: { color: '#fff' },
        formatter: function(p) {
          var idx = cyr_cities.indexOf(p.name);
          if (idx < 0) return p.name + '<br/>' + p.value;
          var d = cyr_cityData[idx];
          return p.name + '<br/>最低: ¥' + d[0] + '<br/>最高: ¥' + d[1] + '<br/>均价: ¥' + d[2].toFixed(2);
        }
      },
      legend: {
        show: true, top: 50,
        textStyle: { color: '#94a3b8' },
        data: ['均价']
      },
      grid: { top: 90, bottom: 30, left: 80, right: 30 },
      xAxis: {
        type: 'category',
        data: cyr_cities,
        axisLabel: { color: '#94a3b8', rotate: 30, fontSize: 11 },
        axisLine: { lineStyle: { color: '#334155' } },
        axisTick: { show: false }
      },
      yAxis: {
        type: 'value',
        name: '元/㎡', nameTextStyle: { color: '#94a3b8' },
        axisLabel: { color: '#94a3b8' },
        axisLine: { lineStyle: { color: '#334155' } },
        splitLine: { lineStyle: { color: 'rgba(51,65,85,0.3)' } }
      },
      series: [{
        name: '均价', type: 'bar', data: data, barWidth: '55%',
        label: {
          show: true, position: 'top',
          formatter: function(p) { return '¥' + p.value.toFixed(0); },
          color: '#fbbf24', fontSize: 11
        },
        animationDuration: 1000
      }]
    };
  }

  chart2.setOption(cyr_buildPolarOption());

  function cyr_polarToggle() {
    cyr_showAvg = !cyr_showAvg;
    if (cyr_showAvg) {
      // 显示均价柱状图
      chart2.setOption(cyr_buildPolarOption());
    } else {
      // 切换为范围展示（range bar）
      var seriesData = cyr_cityData.map(function(item, i) {
        return {
          name: cyr_cities[i],
          value: [item[0], item[1]],
          itemStyle: {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: '#10b981' },
              { offset: 1, color: '#059669' }
            ]),
            borderRadius: [6, 6, 6, 6]
          }
        };
      });
      chart2.setOption({
        legend: { data: ['租金范围'] },
        series: [{
          name: '租金范围', type: 'bar', data: seriesData, barWidth: '55%',
          label: {
            show: true, position: 'top',
            formatter: function(p) { return '¥' + p.value[1]; },
            color: '#10b981', fontSize: 11
          }
        }]
      });
    }
  }
  window.cyr_polarToggle = cyr_polarToggle;

  // 响应式
  window.addEventListener('resize', function() {
    chart1.resize();
    chart2.resize();
  });
})();
</script>
</body>
</html>

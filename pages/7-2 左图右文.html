<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin:0;padding:0;}
        .box{
            width: 100px;
            margin: 20px auto;
            border: 1px solid #ccc;
            padding: 10px;
        }
        .cyr{
            display:flex;
            padding:5px 10px;
            margin-bottom:5px;
            border-bottom:1px dashed #ccc;
        }
        .cyr image{
            width:100px;
        }
        .text{
            margin-left:10px;
            display:flex;
            flex-wrap:wrap;
            font-size: 12px;
            color:#999;
            flex-grow:1;
        }
        .text h3{
            width:100%;
            font-size:16px;
            color:#333;
            line-height:36px;
        }
        .author{
            flex-grow:1;
        }
        .time{
            margin-left:5px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="cyr">
            <image src="./image/1.jpg">
            <div class="text">
                <h3>陈依然的标题1</h3>
                <span class="author">陈依然</span>
                <span class="time">2024-06-10</span>    
            </div>
        </div>

        <div class="cyr">
            <image src="./image/2.jpg">
            <div class="text">
                <h3>陈依然的标题2</h3>
                <span class="author">陈依然</span>
                <span class="time">2024-06-10</span>    
            </div>
        </div>

        <div class="cyr">
            <image src="./image/3.jpg">
            <div class="text">
                <h3>陈依然的标题3</h3>
                <span class="author">陈依然</span>
                <span class="time">2024-06-10</span>    
            </div>
        </div>
    </div>
    <p style="margin-top:20px; text-align:center;">
        <a href="index.html">返回首页</a>
    </p>
</body>
</html>

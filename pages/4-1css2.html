<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2, h3, p {
            padding: 0;
            margin: 0;
        }

        h2 {
            background-color: #000;
            color: #fff;
        }

        #box {
            padding: 8px;
            margin: 20px;
            border: 1px solid #ccc;
            font-size: 12px;
            width: 480px;
        }

        #box h3 {
            font-size: 16px;
            line-height: 33px;
            text-align: center;
            color: #034;
            letter-spacing: 3px;
        }

        #box > p {
            color: #666;
            text-indent: 2em;
            line-height: 150%;
        }

        #box a {
            color: #034;
            text-decoration: none;
        }

        .student-info {
            color: blue;
            font-weight: bold;
        }

        .knowledge {
            background-color: blue;
            color: white;
        }
    </style>
</head>
<body>
    <h2>css群组选择器和后代选择器</h2>

    <div id="box">
        <h3>css进阶</h3>
        <p>
            学号：<span class="student-info">703</span>，
            姓名：<span class="student-info">陈依然</span>，
            班级：<span class="student-info">计算机24007</span>，
            《高级网页设计》设计的学习难度：中等，
            本实例的知识点：
            <span class="knowledge">css群组选择器和后代选择器</span>。
            <a href="#">【更多】</a>
        </p>
    </div>
    <p style="margin-top:20px;">
        <a href="index.html">返回首页</a>
    </p>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>703 陈依然</title>
</head>
<body>
    <h2>表单form</h2>
    <form action="https://www.huanqiu.com" name="cyr">
        <p>用户名：<input type="text" name="username" placeholder="请输入用户名"></p>
        <p>密码：<input type="password" name="password" placeholder="请输入密码"></p>
        <!--性别:男、女、保密-->
        <p>性别：
            <input type="radio" name="sex" value="男" checked>男
            <input type="radio" name="sex" value="女">女
            <input type="radio" name="sex" value="保密">保密
        </p>
        <!--多选-->
        <p>爱好：
            <input type="checkbox" name="hobbies" value="读书" checked>读书
            <input type="checkbox" name="hobbies" value="游泳">游泳
            <input type="checkbox" name="hobbies" value="看电影">看电影
        </p>
        <!--籍贯-->
        <p>籍贯：
            <select name="hometown">
                <option value="北京">北京</option>
                <option value="上海"selected>上海</option>
                <option value="广州">广州</option>
                <option value="深圳">深圳</option>
            </select>
        </p>
        <!--个人介绍-->
        <p>个人介绍：
            <textarea name="introduction" cols="30" rows="5" placeholder="请输入个人介绍"></textarea>
        </p>
        <!--出生日期-->
        <p>出生日期：
            <input type="date" name="birthdate">
        </p>
        <!--上传文件-->
        <p>上传文件：
            <input type="file" name="file">
        </p>
        <!--按钮：普通按钮、提交按钮、重置按钮-->
        <p>
            <input type="button" value="普通按钮">
            <input type="submit" value="提交按钮">
            <input type="reset" value="重置按钮">
        </p>
        <!--表单外的按钮-->
        <p>
            <input type="button" value="表单外的按钮">
        </p>
    </form>
    <p style="margin-top:20px;">
        <a href="index.html">返回首页</a>
    </p>
</body>
</html>

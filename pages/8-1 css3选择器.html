<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css3</title>
    <style>
        .main{
            display:flex;
            flex-wrap:wrap;
            margin:10px;
        }
        .box{
            width: 150px;;
            height:150px;
            border:1px solid #ccc;
            margin:10px;
            display:flex;
            /*水平垂直居中*/
            justify-content:center;
            align-items:center;
            font-size:40px;
            transition:all 0.6s;
            box-sizing: border-box;
            /*width:包含padding和border*/
        }
        .box:first-child:hover{
            background: red;
            font-size: 140px;
        }
        .box:nth-child(2):hover{
            border-radius: 50%;
            border-width: 10px;
        }
        .box:nth-child(3):hover{
            box-shadow: 10px 10px 10px red;
        }
        .box:nth-of-type(4){
            text-shadow: 100px 10px 10px #ccc;
        }
        .box:nth-of-type(5):hover{
            /*线性渐变*/
            background:linear-gradient(#000,#ccc,#fff)
        }
        .box:nth-of-type(5)+.box{
            /*径向渐变*/
            background:radial-gradient(#fff,#ccc,#000)
        }
        /*相邻兄弟选择器
          +后面的那一个兄弟
          ~后面的所有兄弟
        */
        .box:nth-of-type(7):hover{
            /*背景图*/
            transform:scale(0.5)
        }
        .box:nth-child(8):hover{
            transform:translateX(-150px)
        }
        .box:nth-child(9):hover{
            transform:rotateZ(-180deg)
        }
        .box:nth-child(10):hover{
            transform:skewX(20deg) translateY(50px)
        }
        .box:nth-last-child(2):hover::before{
            /*内部的最前面的元素*/
            content:"*";
            color:red;
        }
        /*扩展，第12个盒子，鼠标在上面时显示自己的名字，要求名字深色背景白色文章，水平垂直居中*/
        .box:last-child:hover::after{
            content:"陈依然";
            position:absolute;
            width:150px;
            height:150px;
            background:#333;
            color:#fff;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        /*鼠标在偶数个盒子上时，自定义效果*/
        .box:nth-child(even):hover{
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: #fff;
            transform: translateY(-10px) scale(1.08) rotate(-3deg);
            border-radius: 20px;
            box-shadow: 0 15px 25px rgba(255, 126, 95, 0.35);
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
    </div>
    <div style="padding: 20px;">
        <a href="index.html">返回首页</a>
    </div>
</body>
</html>

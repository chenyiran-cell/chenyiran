<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>703 陈依然</title>
    <style>
        h2{
            color: white;
        }
        h3{
            color: red;
        }
        p{
            color: blue;
        }
        /*标签选择器，选择器名称为标签*/
        #box{
            width: 300px;
            height: 200px;
            background-color:#1b1a1a;
        }
        #nb{
            width: 300px;
            height: 200px;
            background-color:#1b1a1a;
        }
        /*id选择器,以#开始，唯一*/
        .n1{
            color: green;
        }
        .n2{
            color: yellow;
        }
        .n3{
            color: white;
        }
        /*class选择器,以.开始，可以重复使用*/
    </style>
</head>
<body>
    <div id="box">
        <h2>层叠样式表</h2>
        <h3>CSS<span class="n3">选择器</span></h3>
        <p><span class="n1">陈</span><span class="n2">依</span>然</p>
        <p>CSS属性</p>
    </div>
    <div id="nb">
        <h2>24001010703</h2>
    </div>
    <p style="margin-top:20px;">
        <a href="index.html">返回首页</a>
    </p>
</body>
</html>

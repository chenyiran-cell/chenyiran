<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背景颜色动画</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .ambient {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: rgba(108, 99, 255, 0.16);
            filter: blur(2px);
            animation: orbit 8s linear infinite;
        }

        .orb:nth-child(1) {
            top: 8%;
            left: 7%;
            animation-delay: -2s;
        }

        .orb:nth-child(2) {
            right: 7%;
            bottom: 8%;
            width: 220px;
            height: 220px;
            background: rgba(78, 205, 196, 0.16);
            animation-duration: 11s;
            animation-direction: reverse;
        }

        .color-box {
            position: relative;
            z-index: 1;
            width: min(400px, 80vw);
            height: 240px;
            display: grid;
            place-items: center;
            border-radius: 24px;
            box-shadow: 0 18px 50px rgba(31, 37, 55, 0.18);
            background-color: #ff6b6b;
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            transition: background-color 1.2s ease, color 1.2s ease;
            animation: change-color 8s ease-in-out infinite, box-float 4s ease-in-out infinite alternate;
        }

        .color-box span {
            display: block;
            animation: text-glow 2.2s ease-in-out infinite alternate;
        }

        @keyframes change-color {
            0%, 12% { background-color: #ff6b6b; }
            25% { background-color: #4ecdc4; }
            50% { background-color: #ffd166; color: #292929; }
            75% { background-color: #6c63ff; }
            100% { background-color: #ff6b6b; }
        }

        @keyframes box-float {
            from { transform: translateY(-8px) rotate(-1deg); }
            to { transform: translateY(8px) rotate(1deg); }
        }

        @keyframes text-glow {
            from { text-shadow: 0 0 2px rgba(255,255,255,0.7); }
            to { text-shadow: 0 0 14px rgba(255,255,255,1); }
        }

        @keyframes orbit {
            from { transform: translate3d(0, 0, 0) scale(1); }
            50% { transform: translate3d(70px, -40px, 0) scale(1.15); }
            to { transform: translate3d(0, 0, 0) scale(1); }
        }

        @media (max-width: 480px) {
            .color-box {
                height: 180px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="ambient" aria-hidden="true">
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="color-box">
        <span>背景颜色会随着时间变化</span>
    </div>
</body>
</html>
